# Recent updates on the landing page, newest first. The newest few are shown and the
# rest sit behind "Show more" (how many is set by `recent_updates` in _pages/about.md).
# Quote `date` ("2026.10"); unquoted, YAML reads it as the number 2026.1.
# `text` is Markdown. Keep entries emoji-free to match the site's plain style.

- date: "2026.10"
  text: >-
    [Kumo Tabular](https://huggingface.co/nvidia/Kumo-Tabular) was featured by Jensen Huang
    in his [NVIDIA GTC Berlin keynote](https://www.nvidia.com/en-eu/gtc/keynote/)!

- date: "2026.10"
  text: >-
    Our work on large-scale pretraining of relational transformers,
    [RT-J](https://star-project.stanford.edu/rt-j/), has been accepted to NeurIPS 2026!
    The [preprint](https://arxiv.org/abs/2610.17867) is now on arXiv.

- date: "2026.09"
  text: >-
    NVIDIA released [Kumo Tabular](https://huggingface.co/nvidia/Kumo-Tabular),
    the tabular foundation model I worked on during my summer internship.
    ([Blog](https://huggingface.co/blog/nvidia/kumo-tabular))

- date: "2026.08"
  text: >-
    ["Memorilla: Latent Semantic Memory for LLMs"](https://openreview.net/forum?id=VV0vvzL783)
    has been accepted to the Context Beyond the Window workshop at COLM 2026!

- date: "2026.04"
  text: >-
    ["PluRel"](https://arxiv.org/abs/2602.04029) and
    ["Balancing Learning Rates Across Layers"](https://arxiv.org/abs/2606.00340)
    have been accepted to ICML 2026!

- date: "2026.04"
  text: >-
    ["To Think or Not to Think"](https://arxiv.org/abs/2512.05318) has been accepted
